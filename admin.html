<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Ajmeer Enterprises Ltd</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs (Modular v9/v10 via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // آپ کی فائر بیس کنفیگریشن
        const firebaseConfig = {
            apiKey: "AIzaSyALvxl5Gqc3Vg99nCe-dvzDQ8PCoucN...",
            authDomain: "ajmeer-enterprises-ltd.firebaseapp.com",
            databaseURL: "https://ajmeer-enterprises-ltd-default-rtdb.firebaseio.com", // براہ کرم اپنی درست Realtime Database URL یہاں درج کریں اگر ضرورت ہو
            projectId: "ajmeer-enterprises-ltd",
            storageBucket: "ajmeer-enterprises-ltd.appspot.com",
            messagingSenderId: "1007609571015",
            appId: "1:1007609571015:web:3d7649a00aa4c29b6...",
            measurementId: "G-6VGFE47J0J"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // پاسورڈ چیک کرنے کا فنکشن
        window.checkPassword = function(event) {
            event.preventDefault();
            const correctPassword = "12345"; 
            const enteredPassword = document.getElementById("adminPassword").value;

            if (enteredPassword === correctPassword) {
                document.getElementById("loginSection").classList.add("hidden");
                document.getElementById("dashboardSection").classList.remove("hidden");
            } else {
                alert("Wrong Password! Please try again.");
                document.getElementById("adminPassword").value = "";
                window.location.href = "index.html";
            }
        }

        // ایڈ یوزر فارম ظاہر کرنے کا فنکشن
        window.showAddUserForm = function() {
            document.getElementById("addUserFormBox").classList.toggle("hidden");
        }

        // فائر بیس میں نیا یوزر سیو کرنے کا فنکشن
        window.saveNewUser = function(event) {
            event.preventDefault();
            const username = document.getElementById("newUsername").value;
            const password = document.getElementById("newPassword").value;

            const usersRef = ref(db, 'users');
            const newUserRef = push(usersRef);

            set(newUserRef, {
                username: username,
                password: password
            }).then(() => {
                alert("User added successfully and saved to Firebase!");
                document.getElementById("newUsername").value = "";
                document.getElementById("newPassword").value = "";
                document.getElementById("addUserFormBox").classList.add("hidden");
            }).catch((error) => {
                alert("Error adding user: " + error.message);
            });
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #1a252f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .box {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .box h2 {
            color: #1a252f;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .box p {
            color: #777;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            outline: none;
        }

        .box input:focus {
            border-color: #f39c12;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #f39c12;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
        }

        .btn:hover {
            background-color: #d35400;
        }

        .btn-secondary {
            background-color: #34495e;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background-color: #2c3e50;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #1a252f;
        }

        .hidden {
            display: none;
        }

        .dashboard-box h2 {
            color: #f39c12;
        }
    </style>
</head>
<body>

    <!-- 1. لاگ ان فارم باکس -->
    <div id="loginSection" class="box">
        <h2>Admin Portal</h2>
        <p>Please enter your password to continue</p>
        <form onsubmit="checkPassword(event)">
            <input type="password" id="adminPassword" placeholder="Enter Password" required>
            <button type="submit" class="btn">Login</button>
        </form>
        <a href="index.html" class="back-link">Back to Home</a>
    </div>

    <!-- 2. ایڈمن ڈیش بورڈ اور ایڈ یوزر پینل -->
    <div id="dashboardSection" class="box dashboard-box hidden">
        <h2>Admin Dashboard</h2>
        <p>Welcome, Admin! Manage your users below.</p>
        
        <button onclick="showAddUserForm()" class="btn">Add User</button>

        <!-- نیا یوزر ایڈ کرنے کا فارم (بٹن دبانے پر ظاہر ہوگا) -->
        <div id="addUserFormBox" class="hidden" style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; text-align: left;">
            <h3 style="font-size: 16px; margin-bottom: 10px; color: #333;">Create New User</h3>
            <form onsubmit="saveNewUser(event)">
                <label style="font-size: 13px; color: #555;">Username</label>
                <input type="text" id="newUsername" placeholder="Enter username" required style="margin-top: 5px;">
                
                <label style="font-size: 13px; color: #555;">Password</label>
                <input type="password" id="newPassword" placeholder="Enter password" required style="margin-top: 5px;">
                
                <button type="submit" class="btn">Save User to Firebase</button>
            </form>
        </div>

        <a href="index.html" class="btn btn-secondary">Logout / Return to Home</a>
    </div>

</body>
</html>
